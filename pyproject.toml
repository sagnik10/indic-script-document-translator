[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-multilingual-document-translator"
version = "0.1.0"
description = "Local AI-assisted Indic document translation and layout reconstruction MVP"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["translator_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: representative difficult-document fixtures; skipped when private fixtures are absent",
]
